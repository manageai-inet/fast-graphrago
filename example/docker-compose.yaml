services:
  # Elasticsearch 8.17.1
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    container_name: elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:${ELASTIC_PASSWORD:-changeme} http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Kibana 8.17.1
  kibana-token-init:
    image: curlimages/curl:8.12.1
    container_name: kibana-token-init
    user: "0:0"
    restart: "no"
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        echo "Generating Kibana service token..."
        TOKEN=$(
          curl -fsS -u "elastic:$${ELASTIC_PASSWORD}" -X POST \
            "http://elasticsearch:9200/_security/service/elastic/kibana/credential/token" \
            -H "Content-Type: application/json" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p'
        )
        if [ -z "$${TOKEN}" ]; then
          echo "Failed to generate Kibana service token"
          exit 1
        fi
        printf "%s" "$${TOKEN}" > /token/kibana_service_token
        chmod 644 /token/kibana_service_token
        echo "Kibana service token generated."
    volumes:
      - kibana_token:/token
    depends_on:
      elasticsearch:
        condition: service_healthy

  elasticsearch-ui:
    image: docker.elastic.co/kibana/kibana:8.17.1
    container_name: elasticsearch-ui
    restart: always
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        while [ ! -s /token/kibana_service_token ]; do
          sleep 1
        done
        export ELASTICSEARCH_SERVICEACCOUNTTOKEN="$(cat /token/kibana_service_token)"
        exec /usr/local/bin/kibana-docker
    volumes:
      - kibana_data:/usr/share/kibana/data
      - kibana_token:/token
    depends_on:
      kibana-token-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy

volumes:
  elasticsearch_data:
  kibana_data:
  kibana_token:
